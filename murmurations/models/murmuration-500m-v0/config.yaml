version: 0.2.0
architecture: murmurations.training.model.MurmurationModel
model:
  vocab_size: 32768
  d_model: 1024
  n_layers: 28
  n_heads: 16
  d_ff: 4096
  max_seq_len: 4096
  rope_base: 10000.0
  rms_eps: 0.000001
  dropout: 0.0
  max_parents: 4
heads:
  language: tied_token_projection
  operation:
    labels: [NOOP, OBSERVE, QUERY, CLAIM, EVIDENCE, PROPOSE, ACCEPT, REJECT, CHALLENGE, RETRACT, DELEGATE, EXECUTE]
  argument:
    kinds: [NONE, TEXT, VARIABLE, INVARIANT, CLAIM, EVIDENCE, AGENT, CAPABILITY, ARTIFACT, ACTION, SYMBOL, SCALAR, OPERATOR]
    direct_parent_limit: 4
    outputs: [kind, span_start, span_end, operator_pointer, parent_pointers, parent_count, confidence]
