name: shard-000
catalog: murmurations/training/corpus/shard-000-repos.jsonl
output_dir: data/murmurations/shard-000
cache_dir: .cache/murmurations/repos
work_dir: .cache/murmurations/shard-000-work

seed: 17001
eval_fraction: 0.10

# First serious shard: 60 repos x 20 requested unique mutations.
# A successful episode materializes to ~11 protocol decision rows, so the
# target is roughly 13k trajectory rows plus the static code/document stream.
episodes_per_repo: 20
generation_retries: 4
timeout_seconds: 180
max_mutation_attempts: 48

code_chunk_chars: 6000
max_files_per_repo: 1500
max_context_chars: 12000

quality:
  min_catalog_repositories: 50
  min_generation_success_rate: 0.50
  min_dynamic_repositories: 20
  min_unique_mutations: 500
  min_code_rows: 10000
  min_trajectory_rows: 10000
