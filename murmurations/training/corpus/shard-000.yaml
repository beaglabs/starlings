name: shard-000
catalog: murmurations/training/corpus/shard-000-repos.jsonl
output_dir: data/murmurations/shard-000
cache_dir: .cache/murmurations/repos
work_dir: .cache/murmurations/shard-000-work

seed: 17001
eval_fraction: 0.10

# Full serious generation is target-driven and resumable. Limited smoke builds
# can still override a fixed per-repository count from the CLI.
generation:
  mode: targets
  fixed_episodes_per_repo: 2
  max_requests_per_repo: 80
  max_successes_per_repo: 50
  # Each partition keeps one prepared sandbox alive across a burst. Twelve
  # requests amortize clone/install/build while still bounding overshoot.
  burst_per_repo: 12
  partitions_per_repo: 4
  # Optional verifier-untrusted semantic proposals produced by Molab/another
  # LLM proposer. When present, its content hash is part of generation identity.
  semantic_candidates: data/murmurations/shard-000-semantic-candidates.jsonl
  # Use one concurrent burst per eligible repository, capped by Daytona's
  # live organization quota. The current serious catalog has 32 eligible repos.
  concurrency: auto
  max_concurrency: 125
  # Conservative hard planning ceiling. Cost estimation charges the full
  # snapshot disk allocation and assumes every retry lives for the full TTL.
  budget_usd: 3000
  budget_safety_fraction: 0.90
  # Parallel workers retain one shallow pinned checkout and one mutation
  # workspace. Preserve headroom on the Mac instead of risking ENOSPC.
  host_disk_reserve_gib: 2.0
  host_disk_per_worker_gib: 0.5

generation_retries: 4
timeout_seconds: 180
max_mutation_attempts: 48
probe_concurrency: 8
probe_cache:
  report: data/murmurations/shard-000-full-probe.json
  eligible_catalog: data/murmurations/shard-000-eligible.jsonl

code_chunk_chars: 6000
max_files_per_repo: 1500
max_context_chars: 12000

# Static materialization is local; all dynamic repository execution is remote.
sandbox:
  runtime: daytona
  snapshot: murmurations-corpus-v1-2cpu
  target: us
  ttl_minutes: 90
  block_network_after_prepare: false

terminal_evidence:
  enabled: true
  max_calls_per_episode: 2
  operators:
    - type.check
    - package.metadata
    - docs.lookup

quality:
  min_catalog_repositories: 50
  min_eligible_repositories: 20
  min_generation_success_rate: 0.50
  min_dynamic_repositories: 20
  required_dynamic_languages:
    - C
    - C++
    - Go
    - Java
    - JavaScript
    - Python
    - Rust
    - TypeScript
    - Zig
  min_unique_mutations: 500
  min_semantic_mutations: 100
  min_code_rows: 10000
  min_trajectory_rows: 10000
  min_terminal_operator_events: 200
  min_terminal_operator_types: 2
  min_terminal_argv_events: 200
  require_daytona_terminal_execution: true
