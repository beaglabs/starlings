name: shard-000
output_dir: data/murmurations/shard-000

seed: 17001
eval_fraction: 0.10
max_context_chars: 12000

# Bulk supervision is imported from successful, execution-grounded SWE-smith
# trajectories. This catalog is read only to keep imported trajectory repos
# disjoint from the separately-managed static code corpus; no repositories are
# cloned or materialized by import mode.
exclude_catalog: murmurations/training/corpus/shard-000-repos.jsonl

generation:
  mode: import
  source:
    dataset: neulab/agent-data-collection
    config: swe-smith
    split: raw
    revision: 17f755bd6c6588d98a91ae6512576d9772919ab2
    target_rows: 12000
    max_episodes: 1200
    smoke_target_rows: 200
    smoke_max_episodes: 20

  # Optional Blackwell/local OpenAI-compatible semantic augmentation. Disabled
  # by default so corpus generation remains deterministic and endpoint-free.
  semantic_annotation:
    enabled: false
    concurrency: 8
    batch_events: 32

quality:
  min_generation_success_rate: 1.0
  min_episodes: 500
  min_dynamic_repositories: 20
  required_dynamic_languages:
    - Python
  required_operator_refs:
    - repo.search
    - repo.tests
  min_trajectory_rows: 10000
  min_external_execution_events: 1000
