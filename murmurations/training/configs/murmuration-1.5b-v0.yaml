model:
  vocab_size: 32768
  d_model: 1792
  n_layers: 28
  n_heads: 28
  d_ff: 7168
  max_seq_len: 4096
  rope_base: 10000.0
  rms_eps: 0.000001
  dropout: 0.0
  max_parents: 4
  pointer_dim: 128

tokenizer:
  path: murmurations/models/murmuration-500m-v0/tokenizer

training:
  train_data:
    - data/murmurations/pretrain-train.jsonl
    - data/murmurations/shard-000/trajectory-train.jsonl
  eval_data:
    - data/murmurations/pretrain-eval.jsonl
    - data/murmurations/shard-000/trajectory-eval.jsonl
  output_dir: murmurations/training/runs/murmuration-1.5b-v0
  seed: 17
  mixed_precision: bf16
  micro_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 64
  num_workers: 2
  pretokenize: true
  train_token_cache: data/murmurations/cache/murmuration-1.5b-train-4096.pt
  eval_token_cache: data/murmurations/cache/murmuration-1.5b-eval-4096.pt
  learning_rate: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_grad_norm: 1.0
  max_steps: 10000
  warmup_steps: 200
  log_every: 10
  eval_every: 500
  save_every: 500

loss_weights:
  language: 1.0
  operation: 1.0
  argument_kind: 0.5
  argument_start: 0.5
  argument_end: 0.5
  operator_pointer: 0.75
  parent_pointer: 0.5
  parent_count: 0.25
  confidence: 0.1
