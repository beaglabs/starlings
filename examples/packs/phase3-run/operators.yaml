operators:
  - name: python-derive
    runtime:
      kind: python
      target: operators/derive.py
      timeout_ms: 5000
    requires:
      variables:
        - input.value
    provides:
      variables:
        - python.value

  - name: subprocess-check
    runtime:
      kind: subprocess
      target: /usr/bin/env
      timeout_ms: 5000
      args:
        - python3
        - ./operators/check.py
    requires:
      variables:
        - python.value
    provides:
      variables:
        - final.ok
