job_name: starlings-hosted-abc-smoke
credential_mode: gateway

n_attempts: 1
n_concurrent_trials: 3

# A and B intentionally use the exact same hosted model and credential.
# This smoke uses GPT-5 mini only to validate the Hosted Harbor plumbing.
# Swap both model_name values together for the publication model.
agents:
  - name: acp
    source:
      type: github
      repo: beaglabs/starlings
      ref: d1f8191c0d4adcb79eb54a91fb55f6a9137dcfaf
      path: .
      manifest: integrations/harbor/harbor-agent-baseline.json
    model_name: openai/gpt-5-mini
    secrets: [OPENAI_API_KEY]
    env:
      STARLINGS_HARBOR_MAX_TURNS: "12"

  - name: acp
    source:
      type: github
      repo: beaglabs/starlings
      ref: d1f8191c0d4adcb79eb54a91fb55f6a9137dcfaf
      path: .
      manifest: integrations/harbor/harbor-agent-starlings.json
    model_name: openai/gpt-5-mini
    secrets: [OPENAI_API_KEY]
    env:
      STARLINGS_HARBOR_MAX_TURNS: "12"

  - name: acp
    source:
      type: github
      repo: beaglabs/starlings
      ref: d1f8191c0d4adcb79eb54a91fb55f6a9137dcfaf
      path: .
      manifest: integrations/harbor/harbor-agent-deterministic.json
    secrets: []
    env:
      STARLINGS_HARBOR_MAX_TURNS: "12"

# Keep abc.yaml intentionally tiny: validate all three conditions before
# spending money on the real multi-benchmark campaign.
tasks:
  - name: harbor/hello-world
    ref: latest

retry:
  max_retries: 1
  include_exceptions:
    - EnvironmentStartError
