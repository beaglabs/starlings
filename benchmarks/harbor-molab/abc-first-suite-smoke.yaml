job_name: starlings-abc-first-suite-smoke
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 12
quiet: false

environment:
  type: daytona
  delete: true
  gpus: 0

agents:
  - import_path: integrations.harbor.local_agents:BaselineAgent
    model_name: openai/gpt-5-mini
    kwargs:
      max_turns: 50

  - import_path: integrations.harbor.local_agents:StarlingsAgent
    model_name: openai/gpt-5-mini
    kwargs:
      max_turns: 50

  - import_path: integrations.harbor.local_agents:DeterministicStarlingsAgent
    kwargs:
      max_turns: 50

datasets:
  - name: benchflow/skillsbench
    n_tasks: 1
  - name: harbor-index/harbor-index-1.0
    n_tasks: 1
  - name: sierra-research/tau3-bench
    n_tasks: 1
  - name: frontier-bench/frontier-bench
    n_tasks: 1
