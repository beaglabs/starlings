job_name: starlings-abc-hello-world
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 3
quiet: false

environment:
  type: daytona
  delete: true
  gpus: 0

agents:
  - import_path: integrations.harbor.local_agents:BaselineAgent
    model_name: openai/gpt-5-mini
    kwargs:
      max_turns: 12

  - import_path: integrations.harbor.local_agents:StarlingsAgent
    model_name: openai/gpt-5-mini
    kwargs:
      max_turns: 12

  - import_path: integrations.harbor.local_agents:DeterministicStarlingsAgent
    kwargs:
      max_turns: 12

tasks:
  - name: harbor/hello-world
    ref: latest
