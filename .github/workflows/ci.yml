name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Direct protocol-core test
        id: direct
        continue-on-error: true
        run: zig test src/root.zig > zig-test.log 2>&1
      - name: Upload Zig compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-test-log
          path: zig-test.log
      - name: Fail if direct test failed
        if: steps.direct.outcome == 'failure'
        run: |
          cat zig-test.log
          exit 1
      - name: Package-boundary test
        run: zig build test
