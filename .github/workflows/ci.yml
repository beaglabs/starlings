name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Direct protocol-core test
        run: zig test src/root.zig
      - name: Package-boundary test
        run: zig build test
      - name: Python external-operator conformance
        run: python3 -m unittest discover -s python -p 'test_*.py'
