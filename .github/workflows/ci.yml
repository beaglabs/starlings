name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Direct protocol-core test
        run: zig test src/root.zig
      - name: Package-boundary test
        run: zig build test
      - name: Python external-operator conformance
        run: python3 -m unittest discover -s python -p 'test_*.py'

  murmurations-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Murmurations import-test dependencies
        run: python3 -m pip install "PyYAML>=6.0" "blake3>=1.0"
      - name: Murmurations imported-trajectory tests
        run: |
          python3 -m unittest \
            murmurations.training.test_import_swe_smith \
            murmurations.training.test_corpus

  harbor-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python3 -m pip install "uv>=0.8,<1"
      - name: Sync locked ACP runtime
        run: uv sync --frozen --project integrations/harbor
      - name: Harbor contract tests
        run: |
          uv run --project integrations/harbor \
            python -m unittest discover -s integrations/harbor/tests
      - name: Import normal Harbor agents
        run: |
          python3 -m pip install "harbor==0.22.0"
          python3 -c "from integrations.harbor.local_agents import BaselineAgent, StarlingsAgent, DeterministicStarlingsAgent; print(BaselineAgent.name(), StarlingsAgent.name(), DeterministicStarlingsAgent.name())"
      - name: Compile local integration modules
        run: |
          python3 -m py_compile \
            integrations/harbor/local_agents.py \
            integrations/harbor/mcp_bridge.py \
            integrations/harbor/starlings_harbor/inference.py \
            integrations/harbor/starlings_harbor/bridge.py
